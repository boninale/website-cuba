name: Déploiement GitHub Pages

on:
  # Déploie à chaque push sur la branche principale
  push:
    branches: [main]
  # Permet aussi un lancement manuel depuis l'onglet Actions
  workflow_dispatch:

# Permissions nécessaires au déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois ; ne pas annuler un déploiement en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro
        uses: withastro/action@v3
        # with:
        #   node-version: 20   # décommenter pour forcer une version de Node

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
